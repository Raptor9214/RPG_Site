<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (function () {
            // pega URL completa
            const path = location.pathname + location.search + location.hash;

            // salva rota original
            sessionStorage.redirect = path;

            // manda para raiz do app
            location.replace("/RPG_Site/");
        })();
    </script>
</head>
<body></body>
</html>
